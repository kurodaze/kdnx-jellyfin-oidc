<!DOCTYPE html>
<html><head>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<style nonce="___nonce___">
  body { background: #101010; color: #d1cfce; font-family: Noto Sans, Noto Sans HK, Noto Sans JP, Noto Sans KR, Noto Sans SC, Noto Sans TC, sans-serif; }
  #iframe-main { position: absolute; width: 0; height: 0; border: 0; visibility: hidden; opacity: 0; pointer-events: none; z-index: -1; }
</style>
</head><body>
<p>Logging in...</p>
<noscript>Please enable Javascript to complete the login</noscript>
<script nonce="___nonce___">

function getDeviceNameFromUa() {
    const ua = navigator.userAgent;
    if (ua.indexOf('Tizen') !== -1) return 'Samsung Smart TV';
    if (ua.indexOf('Web0S') !== -1 || ua.indexOf('NetCast') !== -1) return 'LG Smart TV';
    if (ua.indexOf('Xbox') !== -1) return 'Xbox';
    if (ua.indexOf('PlayStation') !== -1) return 'PlayStation';
    if (/iPad|iPhone|iPod/.test(ua) || (ua.includes('Mac') && navigator.maxTouchPoints > 1)) return 'iOS Device';
    if (ua.indexOf('Android') !== -1) return 'Android Device';

    // Check Chromium derivatives before Chrome, since their UAs include Chrome/... first.
    if (/Edg\//i.test(ua)) return 'Edge';
    if (/OPR\//i.test(ua)) return 'Opera';
    const match = ua.match(/(Chrome|Safari|Firefox)\/?\s*(\d+)/i) || [];
    return match[1] || 'Web Browser';
}

// Official Android (and similar) embeds NativeShell.AppHost.deviceId() but does not
// write jellyfin-web's localStorage key `_deviceId2`, so seed it from NativeShell.
function resolveDeviceId() {
    let deviceId = localStorage.getItem('_deviceId2');
    if (!deviceId) {
        const host = window.NativeShell && window.NativeShell.AppHost;
        if (host && typeof host.deviceId === 'function') {
            try {
                deviceId = host.deviceId();
                if (deviceId) localStorage.setItem('_deviceId2', String(deviceId));
            } catch (e) { /* ignore */ }
        }
    }
    return deviceId;
}

function resolveAppMeta() {
    const host = window.NativeShell && window.NativeShell.AppHost;
    let appName = 'Jellyfin Web';
    let appVersion = '12.0.0';
    let deviceName = getDeviceNameFromUa();
    try {
        if (host) {
            const read = (fn) => typeof fn === 'function' ? String(fn() || '').trim() : '';
            const nativeApp = read(host.appName);
            const nativeVer = read(host.appVersion);
            const nativeDev = read(host.deviceName);
            if (nativeApp) appName = nativeApp;
            if (nativeVer) appVersion = nativeVer;
            if (nativeDev) deviceName = nativeDev;
        }
    } catch (e) { /* ignore */ }

    return { appName, appVersion, deviceName };
}

function serverIdReady() {
    try {
        const raw = localStorage.getItem('jellyfin_credentials');
        if (!raw) return false;
        return JSON.parse(raw).Servers[0].Id != null;
    } catch (e) {
        return false;
    }
}

const sleep = (milliseconds) => new Promise(resolve => setTimeout(resolve, milliseconds));

async function main() {
    // Seeds _deviceId2 before jellyfin-web can invent a web id.
    let deviceId = resolveDeviceId();
    const appMeta = resolveAppMeta();

    // The wipe forces jellyfin-web to re-bootstrap; keep other servers from going with it.
    const savedCredentials = localStorage.getItem('jellyfin_credentials');
    const fail = (message) => {
        if (savedCredentials != null) {
            localStorage.setItem('jellyfin_credentials', savedCredentials);
        }
        document.querySelector('p').textContent = message;
    };

    localStorage.removeItem('jellyfin_credentials');
    document.getElementById('iframe-main').src = "___jsonPathBase___" + '/web/index.html';

    const data = "___jsonData___";
    let attempts = 0;

    // Wait for server id from the hidden jellyfin-web iframe (shared localStorage).
    // Device id may already be present from NativeShell or from jellyfin-web.
    while (attempts < 150) {
        if (!deviceId) deviceId = resolveDeviceId();
        if (deviceId && serverIdReady()) break;
        await sleep(100);
        attempts++;
    }

    if (!deviceId || !serverIdReady()) {
        fail('Login timed out waiting for client data. Please try again.');
        return;
    }

    const request = {
        deviceId,
        appName: appMeta.appName,
        appVersion: appMeta.appVersion,
        deviceName: appMeta.deviceName,
        data
    };

    const url = "___jsonAuthUrl___";

    let responseJson;
    try {
        const res = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(request)
        });
        responseJson = res.ok ? await res.json() : undefined;
    } catch (e) {
        responseJson = undefined;
    }
    if (!responseJson || !responseJson['User'] || !responseJson['AccessToken']) {
        fail('Authentication failed. Please close this page and try again.');
        return;
    }

    const serverId = responseJson['User']['ServerId'];
    const userId = 'user-' + responseJson['User']['Id'] + '-' + serverId;
    responseJson['User']['EnableAutoLogin'] = true;
    localStorage.setItem(userId, JSON.stringify(responseJson['User']));

    let jfCreds;
    try {
        jfCreds = JSON.parse(localStorage.getItem('jellyfin_credentials'));
    } catch (e) {
        jfCreds = null;
    }
    if (!jfCreds || !Array.isArray(jfCreds.Servers) || jfCreds.Servers.length === 0) {
        jfCreds = { Servers: [{ Id: serverId }] };
    }

    // Restore the other servers, then target this one by Id, not index.
    if (savedCredentials) {
        try {
            for (const server of (JSON.parse(savedCredentials).Servers || [])) {
                if (!jfCreds.Servers.some(s => s.Id === server.Id)) jfCreds.Servers.push(server);
            }
        } catch (e) { /* ignore a malformed previous blob */ }
    }
    const target = jfCreds['Servers'].find(s => s.Id === serverId) || jfCreds['Servers'][0];
    target['AccessToken'] = responseJson['AccessToken'];
    target['UserId'] = responseJson['User']['Id'];
    // AccessToken in localStorage matches upstream jellyfin-web credential storage.
    localStorage.setItem('jellyfin_credentials', JSON.stringify(jfCreds));
    localStorage.setItem('enableAutoLogin', 'true');
    window.location.replace("___jsonPathBase___" + '/web/index.html');
}

document.addEventListener('DOMContentLoaded', function () {
    main();
});

</script><iframe id='iframe-main' sandbox='allow-same-origin allow-scripts'></iframe></body></html>
