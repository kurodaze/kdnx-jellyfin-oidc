name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x
    - name: Build plugin
      run: dotnet build kdnx-jellyfin-oidc/kdnx-jellyfin-oidc.csproj -c Release
    - name: OIDC logic checks
      run: dotnet run --project tests -c Release
    - name: SSO callback page checks
      run: node tests/callback-page.mjs
